name: Ganesh vs RPP-EXACT scalability

on:
  push:
    paths:
      - '.github/workflows/rpp_three_way.yml'
  workflow_dispatch:
    inputs:
      sizes:
        description: "Agent counts, comma-separated (start with 1000,3000,5000)"
        required: true
        default: "1000,3000,5000,10000"
        type: string
      modes:
        description: "Profiles: random,cyclic,identical"
        required: true
        default: "random,cyclic,identical"
        type: string
      repeats:
        description: "Runs per instance"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout published implementation
        uses: actions/checkout@v5

      - name: Install Rust toolchain (rotation_poset)
        uses: dtolnay/rust-toolchain@stable

      - name: Print build environment
        run: |
          g++ --version | head -1
          rustc --version
          cargo --version
          python3 --version

      - name: Compile published RPP-EXACT (SSP)
        run: make -j2 ssp_dijkstra

      - name: Compile Ganesh et al. implementation
        run: g++ -O3 -DNDEBUG -std=c++17 -Wall benchmarks/ganesh_disjoint.cpp -o ganesh_disjoint

      - name: Compare Ganesh and RPP-EXACT on identical inputs
        shell: bash
        env:
          SIZES: ${{ inputs.sizes || '1000,3000,5000,10000' }}
          MODES: ${{ inputs.modes || 'random,cyclic,identical' }}
          REPEATS: ${{ inputs.repeats || '2' }}
        run: |
          mkdir -p benchmark_results
          python3 benchmarks/compare_ganesh_rpp.py \
            --repo "$GITHUB_WORKSPACE" \
            --ganesh "$GITHUB_WORKSPACE/ganesh_disjoint" \
            --sizes "$SIZES" --modes "$MODES" \
            --seeds "41,42,43" --repeats "$REPEATS" \
            --timeout 360 \
            --out benchmark_results/rpp_ganesh_two_way.csv \
            2>&1 | tee benchmark_results/benchmark.log
          exit ${PIPESTATUS[0]}

      - name: Upload CSV, agreement flags and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganesh-vs-rpp-exact-results
          path: benchmark_results/
          if-no-files-found: warn
